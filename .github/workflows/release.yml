name: Publish Windows and macOS release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Synchronized release tag, for example v0.22.0
        required: true
        type: string
      publish_windows:
        description: Build a new Windows version using its existing signing key
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    if: inputs.publish_windows == true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and verify signed Windows release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the Windows signing secret.' }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") { throw 'Tag must match the app version.' }
          npm run tauri -- build --ci -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/create-update-manifest.mjs $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.json
          if-no-files-found: error
  retain_windows:
    if: inputs.publish_windows != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Retain and verify the current signed Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo '${{ github.repository }}' --json tagName --jq .tagName)
          gh release download "$tag" --repo '${{ github.repository }}' --dir release --pattern '*.exe' --pattern '*.exe.sig' --pattern 'latest.json' --pattern 'updates-epoch-*.json'
          node scripts/verify-retained-windows.mjs release
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release/*
          if-no-files-found: error
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build and verify signed Apple Silicon release
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_MACOS }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_MACOS }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo 'Configure the macOS signing secret.' >&2; exit 1; }
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          npm run build:macos
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: artifacts/*
          if-no-files-found: error
  publish:
    needs: [windows, retain_windows, macos]
    if: always() && needs.macos.result == 'success' && (needs.windows.result == 'success' || needs.retain_windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        id: release
        with:
          draft: true
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Publish only after both signed platform bundles are uploaded
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH 'repos/${{ github.repository }}/releases/${{ steps.release.outputs.id }}' -F draft=false --silent
