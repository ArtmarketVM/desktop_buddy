name: Publish Windows and macOS release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: New synchronized version tag, for example v0.23.2
        required: true
        type: string
concurrency:
  group: desktop-buddy-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require reviewed main and a new version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$RELEASE_TAG" = "v$(node -p "require('./package.json').version")"
          test -s "docs/RELEASE_${RELEASE_TAG#v}.md"
          node --test scripts/ci.verify.mjs
          node scripts/prepare-release.mjs --check
          LATEST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" node --input-type=module -e 'import {assertNewerRelease} from "./scripts/verify-release.mjs"; assertNewerRelease(process.env.RELEASE_TAG, process.env.LATEST_TAG);'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This version already exists. Bump the version; never replace release assets.' >&2
            exit 1
          fi
  platforms:
    needs: prepare
    uses: ./.github/workflows/platform-checks.yml
    with:
      release: true
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit
  visual:
    needs: prepare
    uses: ./.github/workflows/visual-checks.yml
  publish:
    needs: [platforms, visual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Combine channels and verify every platform before publication
        run: |
          node --input-type=module - <<'JS'
          import { readdirSync, renameSync } from 'node:fs';
          for (const name of readdirSync('release')) {
            if (name.includes(' ')) renameSync(`release/${name}`, `release/${name.replaceAll(' ', '.')}`);
          }
          JS
          node scripts/create-macos-update-manifest.mjs release "$RELEASE_TAG"
          node scripts/verify-release.mjs release "$RELEASE_TAG"
          (cd release && sha256sum * > SHA256SUMS.txt)
      - name: Publish one complete release without replacing existing assets
        run: |
          LATEST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" node --input-type=module -e 'import {assertNewerRelease} from "./scripts/verify-release.mjs"; assertNewerRelease(process.env.RELEASE_TAG, process.env.LATEST_TAG);'
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "sumi ${RELEASE_TAG#v}" --notes-file "docs/RELEASE_${RELEASE_TAG#v}.md"
          gh release upload "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY"
          LATEST_TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" node --input-type=module -e 'import {assertNewerRelease} from "./scripts/verify-release.mjs"; assertNewerRelease(process.env.RELEASE_TAG, process.env.LATEST_TAG);'
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
