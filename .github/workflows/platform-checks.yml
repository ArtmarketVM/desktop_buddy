name: Shared Windows and macOS validation
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      release_tag:
        type: string
        default: ""
      build_installers:
        type: boolean
        default: false
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_MACOS:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD_MACOS:
        required: false
      BUDDY_MACOS_P12_BASE64:
        required: false
      BUDDY_MACOS_P12_PASSWORD:
        required: false
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            name: windows-x64
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            name: macos-apple-silicon
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    concurrency:
      group: validation-${{ github.sha }}-${{ matrix.name }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.5"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt
      - name: Bind validation to source, toolchain and runner image
        id: inputs
        run: node scripts/ci-inputs.mjs
      - uses: actions/cache/restore@v4
        id: full-cache
        with:
          path: |
            .tools/ci/full
            dist
          key: validated-v1-${{ matrix.name }}-${{ steps.inputs.outputs.validation_key }}
      - name: Verify cached evidence and frontend bytes
        id: proof
        run: node scripts/ci-proof.mjs inspect '${{ steps.inputs.outputs.validation_key }}'
      - uses: Swatinem/rust-cache@v2
        if: steps.proof.outputs.reusable != 'true' || inputs.release || inputs.build_installers
        with:
          workspaces: src-tauri
          shared-key: buddy-${{ (inputs.release || inputs.build_installers) && 'bundle-' || '' }}${{ matrix.target }}-v2
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      - uses: actions/cache/restore@v4
        if: steps.proof.outputs.reusable != 'true'
        id: rust-cache
        with:
          path: .tools/ci/rust
          key: rust-proof-v1-${{ matrix.name }}-${{ steps.inputs.outputs.rust_key }}
      - run: npm ci
        if: steps.proof.outputs.reusable != 'true' || inputs.release || inputs.build_installers
      - name: Report frontend lint findings under the existing non-blocking policy
        if: steps.proof.outputs.reusable != 'true'
        continue-on-error: true
        run: npm run lint
      - name: Run applicable checks once and preserve the full acceptance report
        if: steps.proof.outputs.reusable != 'true'
        run: |
          node scripts/ci-proof.mjs clean
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          npm run test:acceptance -- --output .tools/ci/full/acceptance --rust-evidence .tools/ci/rust/receipt.json --rust-key '${{ steps.inputs.outputs.rust_key }}'
          node scripts/ci-proof.mjs record '${{ steps.inputs.outputs.validation_key }}'
      - name: Record reuse provenance
        if: steps.proof.outputs.reusable == 'true'
        run: echo 'Reused successful validation with matching source, runner, toolchain and frontend artifact bytes.'
      - uses: actions/cache/save@v4
        if: success() && steps.proof.outputs.reusable != 'true' && steps.full-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: |
            .tools/ci/full
            dist
          key: validated-v1-${{ matrix.name }}-${{ steps.inputs.outputs.validation_key }}
      - uses: actions/cache/save@v4
        if: success() && steps.proof.outputs.reusable != 'true' && steps.rust-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: .tools/ci/rust
          key: rust-proof-v1-${{ matrix.name }}-${{ steps.inputs.outputs.rust_key }}
      - name: Verify the frontend before packaging without recompiling it
        if: inputs.release || inputs.build_installers
        run: node scripts/ci-proof.mjs prebuilt '${{ steps.inputs.outputs.validation_key }}'
      - name: Build and verify the signed Windows update
        if: inputs.release && runner.os == 'Windows'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Release signing requires main.' }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure the existing Windows signing key.' }
          npm run tauri -- build --ci --config .tools/ci/prebuilt-frontend.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/create-update-manifest.mjs $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify the signed Apple Silicon installer and update
        if: inputs.release && runner.os == 'macOS'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_MACOS }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_MACOS }}
          BUDDY_MACOS_CODE_SIGNING: internal
          BUDDY_MACOS_P12_BASE64: ${{ secrets.BUDDY_MACOS_P12_BASE64 }}
          BUDDY_MACOS_P12_PASSWORD: ${{ secrets.BUDDY_MACOS_P12_PASSWORD }}
          BUDDY_PREBUILT_FRONTEND_KEY: ${{ steps.inputs.outputs.validation_key }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          npm run build:macos -- aarch64-apple-darwin
      - name: Build an unsigned Windows installer only when explicitly requested
        if: inputs.build_installers && !inputs.release && runner.os == 'Windows'
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json --config .tools/ci/prebuilt-frontend.json -- --locked
      - name: Build an unsigned Apple Silicon installer only when explicitly requested
        if: inputs.build_installers && !inputs.release && runner.os == 'macOS'
        env:
          BUDDY_MACOS_UNSIGNED: "true"
          BUDDY_PREBUILT_FRONTEND_KEY: ${{ steps.inputs.outputs.validation_key }}
        run: npm run build:macos -- aarch64-apple-darwin
      - uses: actions/upload-artifact@v4
        if: inputs.release && runner.os == 'Windows'
        with:
          name: release-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.release && runner.os == 'macOS'
        with:
          name: release-macos-apple-silicon
          path: artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: inputs.build_installers && !inputs.release
        with:
          name: validation-installers-${{ matrix.name }}
          path: |
            artifacts/*
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Retain validation and lint evidence even on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.name }}
          include-hidden-files: true
          path: |
            dist
            .tools/ci/full
            .tools/ci/rust
            .tools/quality
          if-no-files-found: warn
