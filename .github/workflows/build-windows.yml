name: Windows build
on:
  push:
    branches: [main, codex/macos-support]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run test:release
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build a CI installer without release signing
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-buddy-windows
          path: |
            src-tauri/target/release/desktop-buddy.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/updates-epoch-*.json
            updates/compatibility.json
          if-no-files-found: error
