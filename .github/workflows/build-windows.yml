name: Windows build
on:
  push:
    branches: [main, codex/macos-support]
  pull_request:
  workflow_dispatch:
    inputs:
      visual_candidates:
        description: Generate visual candidates for human review and verify a second capture in the same Windows environment
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Report frontend lint findings (non-blocking rollout)
        continue-on-error: true
        run: npm run lint
      - name: Report Rust lint findings (non-blocking rollout)
        continue-on-error: true
        run: npm run lint:rust
      - name: Run ten phase automated acceptance
        run: npm run test:acceptance -- --output .tools/acceptance/ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build a CI installer without release signing
        run: npm run tauri -- build --config src-tauri/tauri.ci.conf.json -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-buddy-windows
          path: |
            src-tauri/target/release/desktop-buddy.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/updates-epoch-*.json
            updates/compatibility.json
          if-no-files-found: error
      - name: Upload acceptance evidence even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-windows-x64
          path: .tools/acceptance/ci/
          if-no-files-found: warn
      - name: Upload lint findings even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-windows-x64
          path: .tools/quality/
          if-no-files-found: warn
  visual:
    name: Windows browser visual coverage (non-blocking rollout)
    runs-on: windows-2022
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Record capture environment
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path test-results -Force | Out-Null
          @{
            commit = (git rev-parse HEAD)
            applicationBase = '11760017314095d75374449690c2a1c42c5af08a'
            runnerOS = $env:RUNNER_OS
            imageOS = $env:ImageOS
            imageVersion = $env:ImageVersion
            osVersion = [Environment]::OSVersion.VersionString
            node = (node --version)
            playwright = (npx playwright --version)
          } | ConvertTo-Json | Set-Content test-results/environment.json
      - name: Generate candidates and verify reproducibility
        if: github.event_name == 'workflow_dispatch' && inputs.visual_candidates
        run: npm run test:visual:candidates
      - name: Compare reviewed baselines without updating them
        if: github.event_name != 'workflow_dispatch' || !inputs.visual_candidates
        run: npm run test:visual
      - name: Upload screenshots, diffs, traces and environment even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-windows-2022
          retention-days: 14
          path: |
            playwright-report/
            test-results/
            visual/baselines/
          if-no-files-found: warn
