name: macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            name: apple-silicon
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: npm ci
      - name: Run ten phase automated acceptance
        run: npm run test:acceptance -- --output .tools/acceptance/ci
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Build a macOS app and disk image for validation
        env:
          BUDDY_MACOS_UNSIGNED: "true"
        run: npm run build:macos -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-buddy-macos-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
      - name: Upload acceptance evidence even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-macos-${{ matrix.name }}
          path: .tools/acceptance/ci/
          if-no-files-found: warn
