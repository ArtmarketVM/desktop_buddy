[package]
name = "desktop-buddy"
version = "0.22.0"
description = "A local-first focus companion for Windows and macOS"
edition = "2021"

[lib]
name = "desktop_buddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
test = false

# An explicit test target lets the Windows linker include Tauri's native manifest.
[[test]]
name = "backend"
path = "src/lib.rs"

[features]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
# Keep the capture plugins compatible with the existing Tauri 2.11 runtime.
tauri-plugin-deep-link = "=2.4.10"
tauri-plugin-single-instance = { version = "=2.4.5", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.2.5"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
dotenvy = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security_Credentials", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Accessibility", "Media_Control", "Win32_System_Registry"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
wiremock = "0.6"
